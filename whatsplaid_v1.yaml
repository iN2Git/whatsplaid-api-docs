---
openapi: 3.0.3
info:
  title: Whatsplaid API
  version: 1.5.4
  description: |
    Public Whatsplaid API for actions and external system integrations with the platform.

    Use this API when another system needs to trigger Whatsplaid resources. Examples:

    - Validate account, store, and active modules.
    - Create, update, and segment contacts with tags and custom fields.
    - Send text messages inside the WhatsApp 24-hour customer service window.
    - Query conversations and messages.
    - Request human handoff.
    - Query products and orders through data sources already connected to Whatsplaid.

    This public API is called by external systems that want to use Whatsplaid resources. Product and
    order data used by the assistant follow the opposite direction: Whatsplaid calls either a native
    integration or the endpoints described by the "Custom Data Connector Contract" during the conversation.
    An external automation workflow may implement that connector by exposing webhooks and querying
    the customer's own database, ERP, spreadsheet, ecommerce platform, or API.

    Outgoing webhooks are a separate flow: Whatsplaid sends enabled lead, message, ticket, and AI-agent
    events to the customer URL. The dedicated "Whatsplaid Outgoing Webhooks" specification is the
    authoritative contract for all seven events, their payloads, headers, and retry behavior.

    List endpoints use offset pagination and return `limit`, `offset`, `next_offset`, and `has_more`.
    Idempotency-Key is reserved but is not active until persistent per-company storage is provisioned;
    clients must not assume replay protection yet.

    Resource endpoints return HTTP 403 with `code: capability_unavailable` when the account's
    plan, modules, configuration, WhatsApp connection, or ecommerce integration does not permit
    the operation. Use `/capabilities` to discover availability before building dynamic interfaces.
servers:
- url: https://api.whatsplaid.com/v1
  description: Production
security:
- bearerAuth: []
tags:
- name: Account
  description: Store, modules, and active connection.
- name: Ecommerce
  description: Product and order queries through the data source configured in Whatsplaid.
- name: Conversations
  description: Conversations initiated by contacts and their message history.
- name: AI Agent
  description: Editable instructions used by the company's AI agent.
- name: Outgoing Webhooks
  description: Webhooks sent by Whatsplaid to the customer's system.
- name: Contacts
  description: Create, query, and update contacts/leads.
- name: Tags and Fields
  description: Segmentation using tags and custom fields.
- name: Messaging
  description: Message sending that respects the WhatsApp service window.
- name: Human Handoff
  description: Human handoff requests.
- name: Tickets
  description: Human-service ticket consultation and controlled closure.
paths:
  "/store":
    get:
      tags:
      - Account
      summary: Return store data
      description: Returns company identification, connected ecommerce provider, and active modules. A successful request with a dedicated Zapier token confirms the pending Zapier connection for that account.
      responses:
        '200':
          description: Store data
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StoreResponse"
              example:
                status: ok
                data:
                  company_id: 10
                  name: My Store
                  email: contact@store.com
                  language: PT
                  country: BR
                  ecommerce:
                    provider: shopify
                    external_store_id: '123456'
                    store_url: mystore.myshopify.com
                    vendor: ''
                    connected: true
                  modules:
                    leads: true
                    sales_consultant: true
                    post_sales: true
                    human_handoff: false
                    knowledge_base: true
        '401':
          "$ref": "#/components/responses/Unauthorized"
  "/me":
    get:
      tags:
      - Account
      summary: "/store alias"
      description: Returns the same data as /store, including confirmation of a pending connection authenticated with a dedicated Zapier token.
      responses:
        '200':
          description: Store data
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StoreResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
  "/modules":
    get:
      tags:
      - Account
      summary: Return active modules
      responses:
        '200':
          description: Active modules
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    "$ref": "#/components/schemas/Modules"
        '401':
          "$ref": "#/components/responses/Unauthorized"
  "/capabilities":
    get:
      tags:
      - Account
      summary: Return effective account capabilities
      description: |
        Returns the operations that are effectively available after applying account status,
        plan entitlement, enabled modules, feature configuration, and connected integrations.
        API consumers should use this endpoint instead of assuming that an operation is available.
      responses:
        '200':
          description: Effective capabilities and structured unavailability reasons
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    "$ref": "#/components/schemas/Capabilities"
        '401':
          "$ref": "#/components/responses/Unauthorized"
  "/ecommerce/integration/test":
    post:
      tags:
      - Ecommerce
      summary: Inspect ecommerce configuration
      description: |
        Reports whether an ecommerce provider is configured and which resources the current
        account exposes. This operation does not make a live request to the external provider
        and therefore does not validate credentials, latency, or provider availability.
      responses:
        '200':
          description: Connection status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  connected:
                    type: boolean
                    example: true
                  ecommerce:
                    "$ref": "#/components/schemas/EcommerceConnection"
                  capabilities:
                    type: array
                    items:
                      type: string
                    example:
                    - products:read
                    - orders:read
        '401':
          "$ref": "#/components/responses/Unauthorized"
  "/ai-agent/prompt":
    get:
      tags:
      - AI Agent
      summary: Get the editable AI agent prompt
      description: |
        Returns the company prompt editable in the Whatsplaid panel. Runtime instructions added
        by Whatsplaid for safety, enabled modules, ticket state, and contact context are not included.
      responses:
        '200':
          description: Current editable prompt
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
                  data: {$ref: '#/components/schemas/AiAgentPrompt'}
        '401':
          "$ref": "#/components/responses/Unauthorized"
    patch:
      tags:
      - AI Agent
      summary: Replace the editable AI agent prompt
      description: |
        Replaces the prompt used as the base instructions for subsequent AI agent responses.
        The prompt cannot be empty and is limited to 50,000 characters. Sending the current
        prompt again is a successful no-op and returns `changed: false`.
        Send the `revision` returned by GET as `expected_revision` to prevent overwriting a prompt
        changed by another user between reading and updating it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt:
                  type: string
                  minLength: 1
                  maxLength: 50000
                expected_revision:
                  type: string
                  description: Optional SHA-256 revision returned by GET for optimistic concurrency control.
            example:
              prompt: You are the customer service AI agent for Example Company.
              expected_revision: 2a4d7b...
      responses:
        '200':
          description: Prompt updated or already identical
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
                  data: {$ref: '#/components/schemas/AiAgentPrompt'}
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '409':
          description: Prompt changed since the supplied revision was read
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/ecommerce/products/search":
    get:
      tags:
      - Ecommerce
      summary: Search products through the configured data source
      description: |
        Searches products through either a native integration, such as Nuvemshop, Wix, or Shopify,
        or a Custom Data Connector configured for the company. This is a read-only data query and
        does not create a cart, checkout, or WhatsApp conversation.
      parameters:
      - name: q
        in: query
        schema:
          type: string
        example: sneakers
        description: Search term, name, SKU, tag, or part of the description.
      - name: url
        in: query
        schema:
          type: string
          format: uri
        example: https://store.com/products/sneakers
        description: Product URL when the plugin or assistant already has the link.
      responses:
        '200':
          description: Product search result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    additionalProperties: true
        '422':
          "$ref": "#/components/responses/ValidationError"
        '401':
          "$ref": "#/components/responses/Unauthorized"
  "/ecommerce/products/{id}":
    get:
      tags:
      - Ecommerce
      summary: Get product by identifier
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: '123456'
      responses:
        '200':
          description: Product found or raw response from the connected integration
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    additionalProperties: true
        '401':
          "$ref": "#/components/responses/Unauthorized"
  "/ecommerce/orders/search":
    get:
      tags:
      - Ecommerce
      summary: Search orders through the configured data source
      description: |
        Searches orders through either a native integration or a Custom Data Connector configured
        for the company. Send at least one filter. This is a read-only data query and does not create
        a cart, checkout, or WhatsApp conversation.
      parameters:
      - name: number
        in: query
        schema:
          type: string
        example: '1001'
        description: Order number or ID.
      - name: email
        in: query
        schema:
          type: string
          format: email
        example: customer@store.com
      - name: phone
        in: query
        schema:
          type: string
        example: '5511999999999'
      responses:
        '200':
          description: Resultado da consulta
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    additionalProperties: true
        '422':
          "$ref": "#/components/responses/ValidationError"
        '401':
          "$ref": "#/components/responses/Unauthorized"
  "/ecommerce/orders/{id}":
    get:
      tags:
      - Ecommerce
      summary: Get order by ID or number
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: '1001'
      responses:
        '200':
          description: Order found or raw response from the connected integration
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    additionalProperties: true
        '401':
          "$ref": "#/components/responses/Unauthorized"
  "/webhook/outgoing/lead-capture":
    post:
      tags:
      - Outgoing Webhooks
      summary: Payload sent by Whatsplaid to the customer's endpoint
      description: |
        This endpoint is illustrative: it represents the request sent by Whatsplaid to the
        URL configured in Developers > Outgoing webhooks for the canonical `lead.created` event.
        See the dedicated outgoing-webhooks specification for all seven supported events.

        Any HTTP 2xx response confirms delivery. Consumers must deduplicate retries by `delivery_id`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LeadCaptureWebhook"
            example:
              event: lead.created
              delivery_id: lead_701b4d2f
              occurred_at: '2026-09-19T15:00:00Z'
              source: unknown
              data:
                id: 123
                name: Jane Smith
                first_name: Jane
                last_name: Smith
                email: jane@example.com
                phone: '+5511999999999'
                tags: [customer]
                custom_fields: {}
              id_lead: 123
              firstname: Jane
              lastname: Smith
              email: jane@example.com
              phone: '+5511999999999'
      responses:
        '200':
          description: Expected response from the customer's system
        '204':
          description: Expected response from the customer's system with no body
  "/contacts":
    get:
      tags:
      - Contacts
      summary: List CRM contacts
      description: |
        Lists people managed by the Whatsplaid lightweight CRM, including captured leads,
        imported contacts, and existing customers identified through tags or custom fields.
        Operational handoff records are not contacts and are excluded. Use pagination with limit and offset.
      parameters:
      - name: phone
        in: query
        schema:
          type: string
        example: '5511999999999'
      - name: email
        in: query
        schema:
          type: string
          format: email
      - name: tag
        in: query
        schema:
          type: string
      - name: date_from
        in: query
        schema:
          type: string
          format: date-time
      - name: exclude_api_origin
        in: query
        description: When true, excludes contacts marked as originating from or already processed by an iPaaS/API flow. Intended for polling triggers that must not emit their own writes.
        schema:
          type: boolean
          default: false
      - name: limit
        in: query
        schema:
          type: integer
          maximum: 100
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Contacts found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ContactsResponse"
    post:
      tags:
      - Contacts
      summary: Create or update contact
      description: |
        Creates or updates a person in the Whatsplaid lightweight CRM. Customer lifecycle,
        funnel, source, and external status should be represented by tags or custom fields.
        Human handoff requests belong to `/handoffs` and are never updated through this resource.
        Creates or partially updates a contact by its complete normalized phone (6–15 digits,
        including country code; first digit must be nonzero). Common formatting is accepted.
        Invalid phones return 422 before any write; multiple matching leads return 409.
        Omitted name, email, tags and custom_fields are preserved on update.
        Provided name/email replace their values; an empty string clears that value.
        Provided tags replace all tags; [] clears them. Omitted tags are preserved.
        custom_fields merges by top-level key: omitted keys remain, supplied values replace
        the previous value, including false, 0, empty string and null (stored, not deletion).
        An empty custom_fields object makes no changes. Nested objects are replaced, not deeply merged.
        A top-level email also updates custom_fields.email and takes precedence over that key.
        The custom field _tags is reserved; use the top-level tags property instead.
        Invalid existing custom-field JSON returns 409 rather than overwriting stored data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ContactUpsert"
            example:
              phone: '5511999999999'
              name: Jane Smith
              email: jane@example.com
              tags:
              - buyer
              - vip
              custom_fields:
                plan: premium
                last_purchase: '2026-05-29'
      responses:
        '200':
          description: Contact updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ContactWriteResponse"
        '201':
          description: Contact created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ContactWriteResponse"
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/contacts/{contactId}":
    get:
      tags:
      - Contacts
      summary: Get contact
      parameters:
      - "$ref": "#/components/parameters/ContactId"
      responses:
        '200':
          description: Contact found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ContactResponse"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/contacts/{contactId}/tags":
    post:
      tags:
      - Tags and Fields
      summary: Add tags
      parameters:
      - "$ref": "#/components/parameters/ContactId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tags
              properties:
                tags:
                  type: array
                  items:
                    type: string
              example:
                tags:
                - buyer
                - vip
      responses:
        '200':
          description: Tags added
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ContactResponse"
    delete:
      tags:
      - Tags and Fields
      summary: Remove tags
      parameters:
      - "$ref": "#/components/parameters/ContactId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tags
              properties:
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Tags removed
  "/contacts/{contactId}/custom-fields":
    patch:
      tags:
      - Tags and Fields
      summary: Update custom fields
      parameters:
      - "$ref": "#/components/parameters/ContactId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example:
              plan: premium
              last_purchase: '2026-05-29'
      responses:
        '200':
          description: Custom fields updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ContactResponse"
  "/messages/send":
    post:
      tags:
      - Messaging
      summary: Send text message
      description: |
        Replies with free-form text only when the contact has already initiated the conversation
        and there is an inbound customer message within the last 24 hours. This endpoint cannot
        start a new conversation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - phone
              - text
              properties:
                phone:
                  type: string
                type:
                  type: string
                  enum:
                  - text
                  default: text
                text:
                  type: string
            example:
              phone: '5511999999999'
              text: Hello, your support request has been updated.
      responses:
        '200':
          description: Message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  sent:
                    type: boolean
                  window_opened_by:
                    type: string
                  window_expires_at:
                    type: string
                    nullable: true
        '403':
          description: Outside the service window
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              example:
                status: error
                code: outside_whatsapp_customer_service_window
                message: Text messages can only be sent inside the WhatsApp customer service window
  "/conversations":
    get:
      tags:
      - Conversations
      summary: List conversations initiated by contacts
      description: |
        Requires phone or date_from to avoid broad exports. Returns only functional conversations
        containing at least one inbound message from the contact. Failed outbound sends and internal
        technical records do not create or reorder conversations. Official WhatsApp accounts are
        isolated by their WABA phone number ID.
        Each item includes whether the automatic assistant is currently active for that conversation.
      parameters:
      - name: phone
        in: query
        schema:
          type: string
      - name: date_from
        in: query
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        schema:
          type: integer
          maximum: 100
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Conversations found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Conversation"
                  pagination:
                    "$ref": "#/components/schemas/Pagination"
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/conversations/{conversationId}/messages":
    get:
      tags:
      - Conversations
      summary: List messages from a conversation
      description: |
        Returns functional inbound messages and replies for a conversation already initiated by
        the contact. Delivery failures may remain in the history for operational diagnosis.
      parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
        description: Conversation phone number.
      - name: limit
        in: query
        schema:
          type: integer
          maximum: 100
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Messages found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Message"
                  pagination:
                    "$ref": "#/components/schemas/Pagination"
                  response_window:
                    "$ref": "#/components/schemas/ResponseWindow"
                  ai_agent:
                    "$ref": "#/components/schemas/ConversationAiAgent"
  "/conversations/{conversationId}/ai-agent":
    parameters:
    - name: conversationId
      in: path
      required: true
      schema:
        type: string
      description: Complete conversation phone number, including country code.
    get:
      tags:
      - Conversations
      summary: Get conversation AI agent state
      description: Returns whether the AI agent is active for this conversation.
      responses:
        '200':
          description: Current AI agent state
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
                  data: {$ref: '#/components/schemas/ConversationAiAgent'}
        '422':
          "$ref": "#/components/responses/ValidationError"
    patch:
      tags:
      - Conversations
      summary: Activate or pause the conversation AI agent
      description: |
        Changes the automatic assistant state only for this conversation. Setting `active` to
        `false` also marks unanswered inbound messages as handled so they are not processed later.
        Repeating the current state is a successful no-op and returns `changed: false`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: {type: boolean}
            examples:
              pause:
                value: {active: false}
              activate:
                value: {active: true}
      responses:
        '200':
          description: AI agent state updated or already in the requested state
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
                  data:
                    allOf:
                    - {$ref: '#/components/schemas/ConversationAiAgent'}
                    - type: object
                      properties:
                        changed: {type: boolean}
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/handoffs":
    post:
      tags:
      - Human Handoff
      summary: Request human handoff
      description: Registers a human handoff request using the company's current configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - phone
              properties:
                phone:
                  type: string
                name:
                  type: string
                email:
                  type: string
                reason:
                  type: string
                category:
                  type: string
                priority:
                  type: string
                  enum:
                  - low
                  - medium
                  - high
            example:
              phone: '5511999999999'
              name: Jane Smith
              email: jane@example.com
              reason: Customer requested human support
              priority: medium
      responses:
        '200':
          description: Handoff requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
  "/tickets":
    get:
      tags:
      - Tickets
      summary: List human-service tickets
      parameters:
      - name: status
        in: query
        schema: {type: string, enum: [open, closed]}
      - name: phone
        in: query
        schema: {type: string}
      - name: date_from
        in: query
        schema: {type: string, format: date-time}
      - name: limit
        in: query
        schema: {type: integer, maximum: 100, default: 50}
      - name: offset
        in: query
        schema: {type: integer, default: 0}
      responses:
        '200':
          description: Paginated tickets
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Ticket'}
                  pagination: {$ref: '#/components/schemas/Pagination'}
        '422': {$ref: '#/components/responses/ValidationError'}
  "/tickets/{ticketId}":
    get:
      tags:
      - Tickets
      summary: Get ticket details
      parameters:
      - {$ref: '#/components/parameters/TicketId'}
      responses:
        '200':
          description: Ticket found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
                  data: {$ref: '#/components/schemas/Ticket'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  "/tickets/{ticketId}/close":
    post:
      tags:
      - Tickets
      summary: Close a ticket
      description: |
        Closes an open ticket, emits `ticket.closed`, and reactivates the conversation AI agent
        when it was paused. This API operation does not send a WhatsApp message to the customer.
        Closing an already closed ticket is a successful no-op with `changed: false`.
      parameters:
      - {$ref: '#/components/parameters/TicketId'}
      responses:
        '200':
          description: Ticket closed or already closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
                  data:
                    type: object
                    properties:
                      changed: {type: boolean}
                      ticket: {$ref: '#/components/schemas/Ticket'}
                      ai_agent: {$ref: '#/components/schemas/ConversationAiAgent'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API token
  parameters:
    Phone:
      name: phone
      in: path
      required: true
      schema:
        type: string
      example: '5511999999999'
    ContactId:
      name: contactId
      in: path
      description: |
        Exact contact ID in the authenticated company takes precedence. If not found,
        a complete normalized phone may be used; partial phones are not accepted.
        Multiple phone matches return 409; invalid phone identifiers return 422.
        A missing short numeric ID returns 404.
      required: true
      schema:
        type: string
    TicketId:
      name: ticketId
      in: path
      required: true
      description: Numeric ticket ID returned by the ticket list.
      schema:
        type: integer
  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
            status: error
            message: Authorization Bearer token not provided
    CapabilityUnavailable:
      description: Operation unavailable for the current account configuration
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
            status: error
            code: capability_unavailable
            capability: products_read
            reason: not_in_plan
            message: This operation is not available for the current account configuration
    ValidationError:
      description: Invalid request
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
            status: error
            message: number, email or phone is required
    NotFound:
      description: Record not found
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
            status: error
            message: Customer not found
  schemas:
    StoreResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        data:
          type: object
          properties:
            company_id:
              type: integer
            name:
              type: string
            email:
              type: string
            language:
              type: string
            country:
              type: string
            ecommerce:
              "$ref": "#/components/schemas/EcommerceConnection"
            modules:
              "$ref": "#/components/schemas/Modules"
            capabilities:
              "$ref": "#/components/schemas/Capabilities"
    EcommerceConnection:
      type: object
      properties:
        provider:
          type: string
          example: shopify
        external_store_id:
          type: string
          example: '123456'
        store_url:
          type: string
          example: mystore.myshopify.com
        vendor:
          type: string
        connected:
          type: boolean
          example: true
    Modules:
      type: object
      properties:
        leads:
          type: boolean
        sales_consultant:
          type: boolean
        post_sales:
          type: boolean
        human_handoff:
          type: boolean
        knowledge_base:
          type: boolean
    Capability:
      type: object
      required: [available, reason]
      properties:
        available:
          type: boolean
        reason:
          type: string
          nullable: true
          enum:
          - account_disabled
          - not_in_plan
          - module_disabled
          - integration_not_configured
          - whatsapp_not_connected
          - resource_not_defined
    Capabilities:
      type: object
      additionalProperties:
        "$ref": "#/components/schemas/Capability"
      example:
        contacts: {available: true, reason: null}
        products_read: {available: false, reason: integration_not_configured}
    AiAgentPrompt:
      type: object
      required: [prompt, length, max_length, revision]
      properties:
        prompt: {type: string}
        length: {type: integer}
        max_length: {type: integer, example: 50000}
        revision: {type: string, description: SHA-256 hash used for optimistic concurrency control}
        changed: {type: boolean, description: Present after PATCH}
    LeadCaptureWebhook:
      type: object
      required: [event, delivery_id, occurred_at, source, data, id_lead, phone]
      properties:
        event:
          type: string
          enum: [lead.created]
        delivery_id:
          type: string
          description: Stable delivery identifier used for deduplication.
        occurred_at:
          type: string
          format: date-time
        source:
          type: string
          enum: [assistant, api, manual, import, unknown]
        data:
          type: object
          required: [id, name, first_name, last_name, email, phone, tags, custom_fields]
          properties:
            id: {type: integer}
            name: {type: string}
            first_name: {type: string}
            last_name: {type: string}
            email: {type: string}
            phone: {type: string}
            tags: {type: array, items: {type: string}}
            custom_fields: {type: object, additionalProperties: true}
        id_lead:
          type: integer
          example: 123
          deprecated: true
        firstname:
          type: string
          example: Jane
          deprecated: true
        lastname:
          type: string
          example: Smith
          deprecated: true
        email:
          type: string
          example: jane@example.com
          deprecated: true
        phone:
          type: string
          example: '+5511999999999'
          deprecated: true
    GenericOkResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        data:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
        code:
          type: string
        capability:
          type: string
        reason:
          type: string
    ContactUpsert:
      type: object
      required:
      - phone
      properties:
        phone:
          type: string
        name:
          type: string
        email:
          type: string
        tags:
          type: array
          items:
            type: string
        custom_fields:
          type: object
          additionalProperties: true
    ContactsResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        data:
          type: array
          items:
            "$ref": "#/components/schemas/Contact"
        pagination:
          "$ref": "#/components/schemas/Pagination"
    Pagination:
      type: object
      required: [limit, offset, has_more]
      properties:
        limit: {type: integer}
        offset: {type: integer}
        next_offset: {type: integer, nullable: true}
        has_more: {type: boolean}
    ContactWriteResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        created:
          type: boolean
        data:
          "$ref": "#/components/schemas/Contact"
    ContactResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        data:
          "$ref": "#/components/schemas/Contact"
    Contact:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        country:
          type: string
        active:
          type: boolean
        human_handoff:
          type: boolean
        created_at:
          type: string
        tags:
          type: array
          items:
            type: string
        custom_fields:
          type: object
          additionalProperties: true
    Conversation:
      type: object
      properties:
        id:
          type: string
        phone:
          type: string
        name:
          type: string
        messages_count:
          type: integer
        last_message_at:
          type: string
        response_window:
          "$ref": "#/components/schemas/ResponseWindow"
        ai_agent:
          "$ref": "#/components/schemas/ConversationAiAgent"
    ConversationAiAgent:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
          description: True when the automatic assistant may reply in this conversation.
    Ticket:
      type: object
      required: [id, number, status, phone, created_at]
      properties:
        id: {type: integer}
        number: {type: string}
        status: {type: string, enum: [open, closed]}
        name: {type: string}
        email: {type: string}
        phone: {type: string}
        summary: {type: string}
        reason: {type: string}
        category: {type: string}
        priority: {type: string}
        created_at: {type: string, format: date-time}
    ResponseWindow:
      type: object
      required: [open, opened_at, expires_at]
      properties:
        open:
          type: boolean
        opened_at:
          type: string
          nullable: true
        expires_at:
          type: string
          nullable: true
    Message:
      type: object
      properties:
        id:
          type: integer
        whatsapp_message_id:
          type: string
        conversation_id:
          type: string
        phone:
          type: string
        name:
          type: string
        direction:
          type: string
          enum:
          - inbound
          - outbound
        type:
          type: string
        mimetype:
          type: string
        status:
          type: string
        body:
          type: string
        error:
          type: string
        created_at:
          type: string
        sent_at:
          type: string
        delivered_at:
          type: string
        read_at:
          type: string
